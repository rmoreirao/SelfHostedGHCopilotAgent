name: ARC smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runner:
    runs-on: copilot-aks-poc
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify ephemeral runner identity
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
          test -n "${AZURE_FEDERATED_TOKEN_FILE:-}"
          test -f "${AZURE_FEDERATED_TOKEN_FILE}"
          echo "EPHEMERAL_RUNNER_VALIDATED=${RUNNER_NAME}"

      - name: Validate private Key Vault access
        env:
          VALIDATION_KEY_VAULT_URL: ${{ vars.VALIDATION_KEY_VAULT_URL }}
          VALIDATION_SECRET_NAME: ${{ vars.VALIDATION_SECRET_NAME }}
          VALIDATION_EXPECTED_VALUE: ${{ vars.VALIDATION_EXPECTED_VALUE }}
        run: bash scripts/Test-RunnerPrivateAccess.sh

      - name: Verify arbitrary internet egress is denied
        shell: bash
        run: |
          set -euo pipefail
          if curl --silent --show-error --fail --max-time 15 https://example.com/ >/dev/null; then
            echo "::error::Azure Firewall unexpectedly allowed example.com."
            exit 1
          fi
          echo "EGRESS_BLOCKED=example.com"
