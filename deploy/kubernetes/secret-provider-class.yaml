apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  provider: azure
  secretObjects:
    - secretName: arc-github-app
      type: Opaque
      data:
        - objectName: github-app-id
          key: github_app_id
        - objectName: github-app-installation-id
          key: github_app_installation_id
        - objectName: github-app-private-key
          key: github_app_private_key
  parameters:
    usePodIdentity: "false"
    clientID: "__SECRET_SYNC_CLIENT_ID__"
    keyvaultName: "__ARC_KEY_VAULT_NAME__"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: github-app-id
          objectType: secret
        - |
          objectName: github-app-installation-id
          objectType: secret
        - |
          objectName: github-app-private-key
          objectType: secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-secret-sync
  namespace: arc-runners
  labels:
    app.kubernetes.io/name: arc-secret-sync
    app.kubernetes.io/part-of: copilot-aks-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arc-secret-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arc-secret-sync
        app.kubernetes.io/part-of: copilot-aks-poc
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: arc-secret-sync
      automountServiceAccountToken: false
      nodeSelector:
        workload: system
      containers:
        - name: sync
          image: mcr.microsoft.com/oss/kubernetes/pause:3.9
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: arc-github-app
              mountPath: /mnt/arc-secrets
              readOnly: true
      volumes:
        - name: arc-github-app
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: arc-github-app
