apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-secret-sync-vault
  namespace: arc-runners
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: arc-secret-sync
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: __ARC_KEY_VAULT_PRIVATE_IP__/32
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
